version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: expediciones_db
    environment:
      POSTGRES_DB: mea-culpa-db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
